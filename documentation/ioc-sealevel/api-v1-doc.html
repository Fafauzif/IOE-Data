    function getCookie() {
        const value = document.cookie;
        const parts = value.split(`;`);
        const phpsessid = parts.filter(item => item.startsWith('PHPSESSID'))[0];
        const result = phpsessid.split('PHPSESSID=').pop();
        return result;
    }
